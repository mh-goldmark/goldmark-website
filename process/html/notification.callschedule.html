<html>
<head>
	<title>Client Inquiry</title>
	<link href='https://fonts.googleapis.com/css?family=Roboto:100,200,300,400,500,600,700,800,900' rel='stylesheet' type='text/css'>
	<style type="text/css">
		body, table, td, th {
			font-family: 'Roboto', sans-serif !important;
			font-size: 14px;
		}
	</style>
	<!--[if mso]>
	<style type="text/css">
	body, table, td, th {
		font-family: Arial, Helvetica, sans-serif !important;
		font-size: 14px;
	}
	</style>
	<![endif]-->
</head>
<body>
	<table width="100%" align="center" cellspacing="0" cellpadding="0">
		<tr>
			<td width="100%" align="center">
				<table width="500" cellpadding="0" cellspacing="1" style="border:1px solid #C0C0C0; width: 500px; border-bottom:3px solid #C0C0C0;">
					<tr>
						<td align="center" width="100%" valign="middle" style="padding:10px">
							<img src="{logo}"/>
						</td>
					</tr>
					<tr>
						<td width="100%" valign="middle" align="left" style="border-top:3px solid #C0C0C0; padding:20px;">
							<p>
								<div style="padding: 7px 10px; background: #D5D5D5; color: #868ba1; font-weight: bold;">SOURCE</div>
								<br/>
								{source}
								<br/>
								<br/>
								<div style="padding: 7px 10px; background: #D5D5D5; color: #868ba1; font-weight: bold;">INQUIRY</div>
								<br/>
								{inquiry}
								<br/>
								<br/>
								<div style="padding: 7px 10px; background: #D5D5D5; color: #868ba1; font-weight: bold;">CLIENT</div>
								<br/>
								<table cellpadding="0" cellspacing="0">
									<tr>
										<td style="padding: 3px 0px;"><strong>Name</strong></td>
										<td style="padding: 3px 10px;">: {name}</td>
									</tr>
									{details}
									<tr>
										<td style="padding: 3px 0px;"><strong>Type</strong></td>
										<td style="padding: 3px 10px;">: {type}</td>
									</tr>
								</table>
							</p>
						</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
</body>
</html>
